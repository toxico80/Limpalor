<?xml version="1.0" encoding="UTF-8"?>
<!-- Limpiador Mint — icono: escoba con hoja de menta -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Mango de la escoba -->
  <g transform="rotate(-38 64 64)">
    <rect x="59" y="10" width="10" height="78" rx="5" fill="#d6b38a"/>
    <rect x="61" y="12" width="3" height="74" rx="1.5" fill="#e8d0b0" opacity="0.6"/>
    <!-- Cinta que sujeta las cerdas -->
    <rect x="50" y="78" width="28" height="9" rx="3" fill="url(#mint)"/>
    <!-- Cerdas -->
    <g fill="#f5e6c8">
      <rect x="46" y="86" width="4.5" height="28" rx="2"/>
      <rect x="52" y="86" width="4.5" height="32" rx="2"/>
      <rect x="58" y="86" width="4.5" height="34" rx="2"/>
      <rect x="64" y="86" width="4.5" height="34" rx="2"/>
      <rect x="70" y="86" width="4.5" height="32" rx="2"/>
      <rect x="76" y="86" width="4.5" height="28" rx="2"/>
    </g>
  </g>
  <!-- Hoja de menta -->
  <g transform="translate(86,22)">
    <path d="M16 2 C6 10 2 22 6 32 C14 28 26 20 26 8 C26 4 22 2 16 2 Z" fill="url(#mint)"/>
    <path d="M16 6 C16 16 12 24 8 28" stroke="#3f6212" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M16 12 C12 14 10 18 9 22" stroke="#3f6212" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M17 12 C21 14 23 17 24 21" stroke="#3f6212" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
